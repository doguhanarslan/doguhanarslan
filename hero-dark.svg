<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 168" width="880" height="168" role="img" aria-label="One codebase, shipped to web, iOS, Android and macOS">
  <style>
    .t { font-family: ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .lbl { font-size:13px; fill:#e6edf3; letter-spacing:.2px; }
    .sub { font-size:11px; fill:#9198a1; letter-spacing:.3px; }
    .src { font-size:12.5px; fill:#e6edf3; letter-spacing:.4px; }
  </style>

  <!-- kaynak -->
  <rect x="24" y="57" width="168" height="54" rx="9" fill="none" stroke="#58a6ff" stroke-width="1.4"/>
  <text class="t src" x="108" y="80" text-anchor="middle">one codebase</text>
  <text class="t sub" x="108" y="96" text-anchor="middle">React · TypeScript · Flutter</text>

  <!-- baglantilar -->
  <g fill="none" stroke="#3d444d" stroke-width="1.3">
    <path d="M192 84 C 250 84, 250 34, 308 34"/>
    <path d="M192 84 L 308 84"/>
    <path d="M192 84 C 250 84, 250 134, 308 134"/>
  </g>
  <g fill="#58a6ff">
    <circle cx="192" cy="84" r="3"/>
  </g>

  <!-- tarayici -->
  <g stroke="#e6edf3" fill="none" stroke-width="1.3">
    <rect x="316" y="16" width="46" height="34" rx="4"/>
    <path d="M316 26 H362"/>
  </g>
  <g fill="#9198a1"><circle cx="322" cy="21" r="1.6"/><circle cx="328" cy="21" r="1.6"/><circle cx="334" cy="21" r="1.6"/></g>
  <text class="t lbl" x="378" y="31">Web</text>
  <text class="t sub" x="378" y="45">installable PWA, offline-capable</text>

  <!-- telefon -->
  <g stroke="#e6edf3" fill="none" stroke-width="1.3">
    <rect x="328" y="66" width="22" height="36" rx="4"/>
    <path d="M335 70 H343"/>
  </g>
  <text class="t lbl" x="378" y="81">iOS · Android</text>
  <text class="t sub" x="378" y="95">packaged with Capacitor, published to store</text>

  <!-- dizustu -->
  <g stroke="#e6edf3" fill="none" stroke-width="1.3">
    <rect x="318" y="116" width="42" height="28" rx="3"/>
    <path d="M310 148 H368"/>
  </g>
  <text class="t lbl" x="378" y="131">macOS</text>
  <text class="t sub" x="378" y="145">same interface, same build</text>
